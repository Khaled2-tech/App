plugins {
    id 'com.android.application'
}

android {
    namespace 'com.focus.app'
    compileSdk 35
    defaultConfig {
        applicationId 'com.focus.app'
        minSdk 23
        targetSdk 28
        versionCode 1
        versionName '0.1.0'
    }
}

// Kotlin 1.8+ already contains the JDK 7/8 extensions.
// Exclude the legacy split artifacts pulled transitively at 1.6.21,
// which otherwise introduce duplicate classes during D8 packaging.
configurations.configureEach {
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
}
